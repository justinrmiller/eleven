name: Release

# Push a version tag to test, build and publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match eleven's version in Cargo.toml *and* Cargo.lock (after bumping `version`,
# run `cargo update --workspace`). "Run workflow" (workflow_dispatch) tests and builds the
# packages as workflow artifacts and never publishes, whichever ref it runs on.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Build jobs run third-party build scripts, so they only get read access; `publish` alone may
# write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check tag matches Cargo.toml and Cargo.lock
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Compare versions
        run: |
          crate="$(./scripts/version.sh)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match eleven's version $crate"
            exit 1
          fi

  test:
    name: tests
    needs: version
    # Runs after `version` passes, or straight away when `version` is skipped (manual runs).
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked

  linux:
    name: Linux ${{ matrix.arch }} (.tar.gz, .deb)
    needs: version
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the binary runs on older glibc versions too.
          - runner: ubuntu-22.04
            arch: x86_64
          # Native ARM64 runner (free for public repositories).
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config dpkg-dev curl
      - name: Install pinned toolchain
        run: |
          # The ARM images may not ship rustup; install it if needed.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustc -vV
      # No build cache here: tag runs could only save caches scoped to that tag, which nothing
      # reuses but which still count against the repository's cache quota.
      - name: Package
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eleven-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  macos:
    name: macOS universal (.dmg, .zip)
    needs: version
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Package
        run: ./scripts/package-macos.sh
      - name: Check the bundle
        run: |
          plutil -lint dist/eleven.app/Contents/Info.plist
          lipo -archs dist/eleven.app/Contents/MacOS/eleven | grep -q x86_64
          lipo -archs dist/eleven.app/Contents/MacOS/eleven | grep -q arm64
          codesign --verify --deep --strict dist/eleven.app
      - uses: actions/upload-artifact@v4
        with:
          name: eleven-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    # Only a pushed tag publishes; manual runs on a tag ref only build.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, test, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | macOS 11+ (Apple Silicon and Intel) | `eleven-*-macos-universal.dmg` (or `.zip`) |
            | Linux x86_64, Debian/Ubuntu | `eleven_*_amd64.deb`: `sudo apt install ./eleven_*_amd64.deb` |
            | Linux ARM64, Debian/Ubuntu (e.g. Raspberry Pi OS 64-bit) | `eleven_*_arm64.deb` |
            | Linux, other distros | `eleven-*-linux-x86_64.tar.gz` or `eleven-*-linux-aarch64.tar.gz` |

            Linux packages need glibc 2.35 or newer (Ubuntu 22.04, Debian 12 and later).

            **macOS:** the app is not notarized, so macOS blocks the first launch. On macOS 15 or
            later, open **System Settings → Privacy & Security**, scroll down to the message about
            eleven and click **Open Anyway**. On macOS 14 and earlier, right-click `eleven.app`
            and choose **Open**. Either way, `xattr -dr com.apple.quarantine /Applications/eleven.app`
            also works.

            **Verify a download** against `SHA256SUMS.txt` (files you didn't download are skipped):
            `sha256sum -c --ignore-missing SHA256SUMS.txt` on Linux, or
            `shasum -a 256 -c --ignore-missing SHA256SUMS.txt` on macOS.

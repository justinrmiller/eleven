name: Release

# Push a version tag to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match `version` in Cargo.toml. "Run workflow" (workflow_dispatch) builds the
# packages as workflow artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check tag matches Cargo.toml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }} (.tar.gz, .deb)
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary runs on older glibc versions too.
          - runner: ubuntu-22.04
            arch: x86_64
          # Native ARM64 runner (free for public repositories).
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config curl
      - name: Install pinned toolchain
        run: |
          # The ARM images may not ship rustup; install it if needed.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Package
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: eleven-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  macos:
    name: macOS universal (.dmg, .zip)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos
      - name: Package
        run: ./scripts/package-macos.sh
      - name: Check the bundle
        run: |
          plutil -lint dist/eleven.app/Contents/Info.plist
          lipo -archs dist/eleven.app/Contents/MacOS/eleven | grep -q x86_64
          lipo -archs dist/eleven.app/Contents/MacOS/eleven | grep -q arm64
          codesign --verify --deep --strict dist/eleven.app
      - uses: actions/upload-artifact@v4
        with:
          name: eleven-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | macOS 11+ (Apple Silicon and Intel) | `eleven-*-macos-universal.dmg` (or `.zip`) |
            | Linux x86_64, Debian/Ubuntu | `eleven_*_amd64.deb`: `sudo apt install ./eleven_*_amd64.deb` |
            | Linux ARM64, Debian/Ubuntu (e.g. Raspberry Pi OS 64-bit) | `eleven_*_arm64.deb` |
            | Linux, other distros | `eleven-*-linux-x86_64.tar.gz` or `eleven-*-linux-aarch64.tar.gz` |

            **macOS:** the app is not notarized yet, so the first launch is blocked. Right-click
            `eleven.app` and choose **Open**, or run `xattr -dr com.apple.quarantine /Applications/eleven.app`.

            Verify downloads with `sha256sum -c SHA256SUMS.txt`.
